<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squash Oulu | Etusivu</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
</head>
<body data-page="index">
  <div class="page-shell">
    <div id="siteHeader"></div>
    <main  class="content-grid">
      <section class="main-column">
        <section class="content-block">
          <h1 data-i18n="homeTitle">Tervetuloa Squash Ouluun</h1>
          <p data-i18n="homeText"><strong>Oulun Squash Klubi (OSK)</strong> on vuonna 1976 perustettu oululainen squashseura. Seura tarjoaa squash-toimintaa kaikenikäisille ja -tasoisille pelaajille - aloittelijoista aktiiviharrastajiin ja kilpapelaajiin. Tervetuloa mukaan!</p>

          <section class="news-block" aria-labelledby="news-title">
            <h2 id="news-title">Ajankohtaista</h2>
            <div class="news-image-grid">
              <figure class="news-image-card">
                <img src="assets/kepelit.jpeg" alt="Kepelit" loading="lazy" />
                <figcaption class="news-caption" data-i18n="newsCaptionKepelit">Legendaariset keskiviikon peli-illat jatkuvat 2.9.2026!</figcaption>
              </figure>
              <figure class="news-image-card">
                <img src="assets/perhekossi.jpeg" alt="Perhekossi" loading="lazy" />
                <figcaption class="news-caption" data-i18n="newsCaptionPerhekossi">Perhekössi-tapahtuma järjestetään lauantaina 10.10.2026, tervetuloa mukaan!</figcaption>
              </figure>
            </div>
          </section>
        </section>
      </section>

      <aside class="sidebar" id="siteEvents"></aside>
</main>
    <div id="siteFooter"></div>
</div>
  <script src="js/app.js?v=2"></script>
</body>
</html>
